name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm typecheck:package
      - run: pnpm typecheck:reference
      - run: pnpm test

  package:
    needs: quality
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter reference-app package
      - uses: actions/upload-artifact@v4
        with:
          name: reference-app-${{ matrix.os }}
          path: examples/reference-app/out
          if-no-files-found: error
