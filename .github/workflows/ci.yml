name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:verify

  package:
    needs: quality
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install RPM tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes rpm squashfs-tools
      - name: Verify RPM tooling
        if: matrix.os == 'ubuntu-latest'
        run: command -v rpmbuild && command -v mksquashfs
      - run: pnpm install --frozen-lockfile
      - run: pnpm make
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: out/make
          if-no-files-found: error
